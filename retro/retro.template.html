<!doctype html>
<html><head><meta charset="utf-8"><title>Clawd Night</title>
<style>
@font-face{font-family:"Plex Arabic";font-weight:600;src:url(../reel/fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:"Plex Arabic";font-weight:700;src:url(../reel/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:"Plex Arabic";font-weight:600;src:url(../reel/fonts/ibm-plex-sans-arabic-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Plex Arabic";font-weight:700;src:url(../reel/fonts/ibm-plex-sans-arabic-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"JBMono";font-weight:600;src:url(../reel/fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(function(){
"use strict";
const EVT = /*__EVENTS__*/;
const W = 1080, H = 1920, LW = 270, LH = 480, S = 4, DUR = 60;
const out = document.getElementById('c'), o = out.getContext('2d');
const lo = document.createElement('canvas'); lo.width = LW; lo.height = LH;
const p = lo.getContext('2d');
const AR = '"Plex Arabic", sans-serif';

/* ---------- helpers ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x*x*(3-2*x);
const prog = (t, a, b) => ease((t-a)/(b-a));
const lerp = (a, b, k) => a + (b-a)*k;
const px = (x, y, w, h, c) => { p.fillStyle = c; p.fillRect(Math.round(x), Math.round(y), w, h); };
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const rgb = a => 'rgb(' + a.map(v => Math.round(v)).join(',') + ')';
const mix = (a, b, k) => a.map((v, i) => v + (b[i]-v)*k);
// colours snap to a small palette step so everything stays "8-bit"
const snap = a => a.map(v => Math.round(v/17)*17);
function lastBefore(list, t){ let r = -99; for (const x of list){ if (x <= t) r = x; else break; } return r; }
const since = (list, t) => t - lastBefore(list, t);

/* ---------- sky across the night ---------- */
const SKY = [
  [0,  '#2b1f5c', '#c0507a', '#ffa25a'],
  [10, '#211c55', '#7a3f84', '#ef7161'],
  [15, '#131848', '#2c2a6a', '#5a3f82'],
  [21, '#0a0f33', '#141c50', '#22306c'],
  [44, '#090d2c', '#121a48', '#1e2a60'],
  [50, '#14205a', '#3a3f86', '#a2709a'],
  [56, '#2a4aa0', '#6f7ac2', '#ffb27a'],
  [60, '#3a62b8', '#8d98d4', '#ffd08a']
];
function skyAt(t){
  let i = 0; while (i+1 < SKY.length && SKY[i+1][0] <= t) i++;
  const a = SKY[i], b = SKY[Math.min(i+1, SKY.length-1)], k = b[0] > a[0] ? ease((t - a[0])/(b[0]-a[0])) : 0;
  return [1,2,3].map(j => mix(hex(a[j]), hex(b[j]), k));
}
function drawSky(t){
  const [top, mid, hor] = skyAt(t), bands = 22, bh = 16;
  const col = i => { const u = i/(bands-1); return snap(u < 0.55 ? mix(top, mid, u/0.55) : mix(mid, hor, (u-0.55)/0.45)); };
  for (let i = 0; i < bands; i++) px(0, i*bh, LW, bh, rgb(col(i)));
  // dithered seams between bands
  for (let i = 1; i < bands; i++){ p.fillStyle = rgb(col(i)); const y = i*bh - 1; for (let x = (i % 2); x < LW; x += 2) p.fillRect(x, y, 1, 1); p.fillStyle = rgb(col(i-1)); for (let x = ((i+1) % 2); x < LW; x += 2) p.fillRect(x, i*bh, 1, 1); }
  px(0, bands*bh, LW, LH - bands*bh, rgb(col(bands-1)));
}

/* ---------- world ---------- */
const R1 = rng(5);
const stars = []; for (let i = 0; i < 110; i++) stars.push({ x: Math.floor(R1()*LW), y: Math.floor(12 + R1()*250), on: 18 + R1()*8, ph: R1()*6.28, sp: 1 + R1()*3, big: R1() < 0.12 });
const FIRST = { x: 70, y: 70 };
const BLD = [
  { x: 0,   w: 38, top: 334 }, { x: 40,  w: 34, top: 312 }, { x: 76,  w: 40, top: 340 }, { x: 118, w: 36, top: 322 },
  { x: 156, w: 40, top: 332 }, { x: 198, w: 34, top: 314 }, { x: 234, w: 36, top: 328 }
];
const R2 = rng(17);
const wins = [];
const blipsCity = EVT.blip.filter(x => x < 40);
BLD.forEach((b, bi) => {
  for (let x = b.x + 4; x < b.x + b.w - 4; x += 6) for (let y = b.top + 8; y < LH; y += 8){
    if (R2() < 0.55){
      const on = blipsCity.length ? blipsCity[Math.floor(R2()*blipsCity.length)] : 26;
      wins.push({ x, y, bi, on, off: R2() < 0.5 ? 40 + R2()*10 : 99, c: R2() < 0.25 ? '#ffd27a' : (R2() < 0.5 ? '#ffe9a8' : '#ffb85c') });
    }
  }
});
const R3 = rng(41);
const flies = []; for (let i = 0; i < 18; i++) flies.push({ x: R3()*LW, y: 150 + R3()*160, ph: R3()*6.28, sp: 0.4 + R3()*0.7 });

function drawStars(t){
  const fade = 1 - prog(t, 48, 56);
  for (const s of stars){
    if (t < s.on || fade <= 0) continue;
    const tw = Math.sin(t*s.sp + s.ph), vis = (t - s.on) < 0.3 ? 0 : 1;
    if (!vis || tw < -0.6 + (1 - fade)*1.6) continue;
    const c = tw > 0.4 ? '#ffffff' : '#c9d2ff';
    px(s.x, s.y, 1, 1, c);
    if (s.big && tw > 0.5){ px(s.x - 1, s.y, 1, 1, '#8b95d8'); px(s.x + 1, s.y, 1, 1, '#8b95d8'); px(s.x, s.y - 1, 1, 1, '#8b95d8'); px(s.x, s.y + 1, 1, 1, '#8b95d8'); }
  }
  // the first star: a sparkle that arrives with its own chime
  if (t >= 12.5 && t < 52){
    const k = since(EVT.twinkle, t) < 0.6 && t < 13.2 ? 1 : 0, f = Math.floor(t*4) % 2;
    const L = 2 + (k ? 3 : f);
    px(FIRST.x, FIRST.y, 1, 1, '#ffffff');
    for (let i = 1; i <= L; i++){ const c = i < 2 ? '#fff6c8' : '#c9b8ff'; px(FIRST.x + i, FIRST.y, 1, 1, c); px(FIRST.x - i, FIRST.y, 1, 1, c); px(FIRST.x, FIRST.y + i, 1, 1, c); px(FIRST.x, FIRST.y - i, 1, 1, c); }
  }
}
function circleRows(cx, cy, r, fn){ for (let dy = -r; dy <= r; dy++){ const hw = Math.floor(Math.sqrt(r*r - dy*dy)); fn(dy, hw); } }
function drawSun(t){
  if (t < 15){
    const k = t/14, cx = 62, cy = Math.round(222 + k*140), r = 20;
    circleRows(cx, cy, r, (dy, hw) => {
      if (dy > 2 && (dy % 5 === 0 || (dy > 9 && dy % 5 === 1))) return;   // synthwave stripes
      const u = (dy + r)/(2*r), c = snap(mix([255,236,140], [255,96,120], u));
      px(cx - hw, cy + dy, hw*2 + 1, 1, rgb(c));
    });
  }
  if (t > 53){
    const k = prog(t, 53, 60), cx = 196, cy = Math.round(360 - 60*k), r = 18;
    circleRows(cx, cy, r, (dy, hw) => { if (dy > 3 && dy % 4 === 0) return; px(cx - hw, cy + dy, hw*2 + 1, 1, rgb(snap(mix([255,240,170], [255,150,110], (dy + r)/(2*r))))); });
  }
}
function drawMoon(t){
  if (t < 18 || t > 56) return;
  const k = prog(t, 18, 24.5), d = prog(t, 24.5, 48), sink = prog(t, 49, 56);
  const cx = Math.round(lerp(lerp(250, 205, k), 190, d)), cy = Math.round(lerp(lerp(300, 62, k), 55, d) + sink*120), r = 12;
  // glow ring
  for (let a = 0; a < 24; a++){ const an = a/24*Math.PI*2; if ((a + Math.floor(t*2)) % 3) px(cx + Math.round(Math.cos(an)*(r + 4)), cy + Math.round(Math.sin(an)*(r + 4)), 1, 1, '#3a4690'); }
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++){
    if (dx*dx + dy*dy > r*r) continue;
    const ex = dx - 6, ey = dy + 4; if (ex*ex + ey*ey < (r - 1)*(r - 1)) continue;
    const c = (dx + dy) % 7 === 0 && dx*dx + dy*dy < 60 ? '#d8cfa8' : '#fff4cc';
    px(cx + dx, cy + dy, 1, 1, c);
  }
}
const SHOOT = [{ t0: 33.2, x0: 8, y0: 40, x1: 136, y1: 270, caught: true }, { t0: 35.8, x0: 60, y0: 20, x1: 250, y1: 110, caught: false }];
function drawShooting(t){
  for (const s of SHOOT){
    const dur = s.caught ? 0.8 : 0.8, u = (t - s.t0)/dur; if (u < 0 || u > 1) continue;
    const x = lerp(s.x0, s.x1, u), y = lerp(s.y0, s.y1, u);
    const dx = (s.x1 - s.x0), dy = (s.y1 - s.y0), Ld = Math.hypot(dx, dy);
    for (let i = 0; i < 18; i++){ const tx = x - dx/Ld*i*1.6, ty = y - dy/Ld*i*1.6; px(tx, ty, 1, 1, i < 3 ? '#ffffff' : (i < 9 ? '#ffe68a' : '#c08bff')); }
    px(x - 1, y - 1, 3, 3, '#ffffff');
  }
}
function drawCity(t){
  const dark = prog(t, 3, 16), dawn = prog(t, 52, 60);
  const base = snap(mix(mix([64,40,84], [14,16,40], dark), [40,44,92], dawn*0.6));
  px(0, 346, LW, LH - 346, rgb(snap(mix(base, [0,0,0], 0.25))));   // back row fills the gaps
  for (const b of BLD){
    px(b.x, b.top, b.w, LH - b.top, rgb(base));
    px(b.x, b.top, b.w, 1, rgb(snap(mix(base, [255,255,255], 0.12))));          // roof edge
    px(b.x + 3, b.top - 3, 4, 3, rgb(base)); if (b.w > 35) px(b.x + b.w - 9, b.top - 5, 2, 5, rgb(base)); // little roof props
  }
  for (const w of wins){
    if (t < w.on || t > w.off || dawn > 0.75) continue;
    const fresh = t - w.on < 0.18;
    px(w.x, w.y, 2, 3, fresh ? '#ffffff' : w.c);
  }
  // each landing lights up a burst of windows in that building
  EVT.hop_land.forEach((tl, i) => {
    if (t < tl || t > tl + 0.35) return;
    const b = BLD[HOP_SEQ[i + 1]];
    px(b.x, b.top - 1, b.w, 1, '#ffe68a');
  });
}
function drawFlies(t){
  const v = prog(t, 38.4, 40) * (1 - prog(t, 45, 47)); if (v <= 0) return;
  for (const f of flies){
    if (Math.sin(t*3 + f.ph*5) < 0.3 - v) continue;
    const x = f.x + Math.round(10*Math.sin(t*f.sp + f.ph)), y = f.y + Math.round(6*Math.cos(t*f.sp*1.4 + f.ph));
    px(x, y, 1, 1, '#fff3a0'); if (Math.sin(t*5 + f.ph) > 0.6) { px(x - 1, y, 1, 1, '#7a7a30'); px(x + 1, y, 1, 1, '#7a7a30'); }
  }
}

/* ---------- Clawd ---------- */
const BODY = [
  '  HHHOOOOOOOOO  ',
  '  OOOOOOOOOOOO  ',
  '  OOOOOOOOOOOO  ',
  'AAOOOOOOOOOOOOAA',
  'AAOOOOOOOOOOOOAA',
  '  OOOOOOOOOOOO  ',
  '  DDDDDDDDDDDD  '
];
const COLS = { O: '#d97757', H: '#ec9a78', D: '#b5603f', A: '#d97757', L: '#a8563a', E: '#16121c' };
const CS = 3;  // each sprite cell is 3x3 low-res pixels
// rooftop path: building index for each stretch, plus the hop sequence over the roofs
const HOP_SEQ = [3, 4, 5, 4, 3, 2, 3];
function roofX(bi){ const b = BLD[bi]; return b.x + b.w/2; }
function clawdPos(t){
  let x = roofX(3), y = BLD[3].top, jump = 0, squash = 0;
  if (t < 2.75){ const u = clamp((t - 2.25)/0.5, 0, 1); y = lerp(-40, BLD[3].top, u*u); if (t < 2.25) y = -60; jump = 1; }
  if (t >= 2.75 && t < 2.9) squash = 1;
  EVT.hop_land.forEach((tl, i) => {
    const to = tl - 0.45;
    if (t >= to && t < tl){ const u = (t - to)/0.45; const a = BLD[HOP_SEQ[i]], b = BLD[HOP_SEQ[i+1]];
      x = lerp(roofX(HOP_SEQ[i]), roofX(HOP_SEQ[i+1]), u); y = lerp(a.top, b.top, u) - Math.sin(Math.PI*u)*26; jump = 1; }
    if (t >= tl) { x = roofX(HOP_SEQ[i+1]); y = BLD[HOP_SEQ[i+1]].top; }
    if (t >= tl && t < tl + 0.12) squash = 1;
  });
  // the catch: straight up to meet the shooting star
  if (t >= 33.6 && t < 34.45){ const u = (t - 33.6)/0.85; y = BLD[3].top - Math.sin(Math.PI*u)*44; jump = 1; }
  if (t >= 34.45 && t < 34.57) squash = 1;
  if (t >= 52.75 && t < 53.2){ const u = (t - 52.75)/0.45; y = BLD[3].top - Math.sin(Math.PI*u)*20; jump = 1; }
  return { x, y, jump, squash };
}
function drawClawd(t, talking){
  const pos = clawdPos(t); if (pos.y < -30) return;
  const sitting = (t >= 38.6 && t < 46.2) || (t >= 6.4 && t < 11.6);
  const sleepy = t >= 46.2 && t < 52.6;
  const lookUp = (t >= 12.6 && t < 25) || (t >= 32.6 && t < 34.5) || (t >= 38.6 && t < 45);
  const wave = (t >= 19.5 && t < 22.5) || t >= 55.2;
  const walkF = Math.floor(t*5) % 2;
  const bob = talking && !pos.jump ? (Math.floor(t*8) % 2) : 0;
  const breathe = !talking && !pos.jump && Math.floor(t*1.6) % 2;
  const rows = BODY.slice();
  const w = 16*CS, legH = sitting ? 0 : 2*CS;
  const bodyH = (pos.squash ? rows.length - 1 : rows.length)*CS;
  const ox = Math.round(pos.x - w/2), oy = Math.round(pos.y - bodyH - legH - bob - (sitting ? -2 : 0) + (breathe ? 1 : 0));
  // shadow on the roof
  if (!pos.jump) px(ox + 4, Math.round(pos.y), w - 8, 1, 'rgba(0,0,0,0.35)');
  // body
  let ry = 0;
  rows.forEach((r, i) => {
    if (pos.squash && i === 1) return;
    for (let c = 0; c < 16; c++){
      const ch = r[c]; if (ch === ' ') continue;
      if (ch === 'A' && wave && c > 8) continue;          // right arm drawn separately while waving
      px(ox + c*CS, oy + ry*CS, CS, CS, COLS[ch]);
    }
    ry++;
  });
  if (pos.squash){ px(ox - 2, oy + (ry - 2)*CS, 2, CS, COLS.O); px(ox + w, oy + (ry - 2)*CS, 2, CS, COLS.O); }
  if (wave){ const up = Math.floor(t*4) % 2; px(ox + 14*CS, oy + (up ? 0 : 1)*CS, 2*CS, 2*CS, COLS.A); px(ox + 15*CS, oy + (up ? -1 : 0)*CS, CS, CS, COLS.A); }
  // eyes
  const blink = (t % 3.3) < 0.12;
  const eyeY = oy + (lookUp ? 1 : 2)*CS;
  [4, 10].forEach(c => {
    if (sleepy || blink) px(ox + c*CS - 1, eyeY + CS + 1, CS + 2, 1, COLS.E);
    else px(ox + c*CS, eyeY, CS, 2*CS, COLS.E);
  });
  // legs
  if (!sitting){
    const legs = pos.jump ? [2, 4, 11, 13] : (walkF && t >= 25 && t < 32 ? [3, 5, 10, 12] : [3, 5, 10, 12]);
    const ly = oy + bodyH;
    legs.forEach((c, i) => px(ox + c*CS, ly, CS, pos.jump && i % 2 ? CS : 2*CS, COLS.L));
  }
  // "!" alert above the head
  const alertT = [12.55, 33.0, 52.6].find(a => t >= a && t < a + 0.9);
  if (alertT !== undefined){
    const b = Math.floor((t - alertT)*8) % 2;
    px(pos.x - 2, oy - 16 - b, 4, 8, '#ffffff'); px(pos.x - 2, oy - 6 - b, 4, 3, '#ffffff');
    px(pos.x - 3, oy - 17 - b, 6, 1, '#16121c');
  }
  // sleepy z's
  if (sleepy){
    for (let i = 0; i < 3; i++){
      const u = ((t*0.6 + i/3) % 1), zx = Math.round(pos.x + 14 + u*14), zy = Math.round(oy - 4 - u*26), s = 3 + i % 2;
      if (u > 0.85) continue;
      px(zx, zy, s, 1, '#e8e4ff'); px(zx + s - 1 - 1, zy + 1, 1, 1, '#e8e4ff'); px(zx + 1, zy + 2, 1, 1, '#e8e4ff'); px(zx, zy + s - 1, s, 1, '#e8e4ff');
    }
  }
  return { x: pos.x, top: oy };
}
// sparkle burst when the star is caught
function drawCatch(t){
  const u = (t - 34.0)/0.7; if (u < 0 || u > 1) return;
  const cx = 136, cy = 270;
  for (let i = 0; i < 12; i++){ const a = i/12*Math.PI*2, r = 4 + u*26; px(cx + Math.cos(a)*r, cy + Math.sin(a)*r, 2, 2, i % 2 ? '#ffe68a' : '#ffffff'); }
}

/* ---------- pixel UI ---------- */
function box(x, y, w, h, fill){
  px(x, y, w, h, fill);
  px(x, y, w, 1, '#ffffff'); px(x, y + h - 1, w, 1, '#ffffff'); px(x, y, 1, h, '#ffffff'); px(x + w - 1, y, 1, h, '#ffffff');
  px(x + 2, y + 2, w - 4, 1, '#6a6aa8'); px(x + 2, y + h - 3, w - 4, 1, '#6a6aa8'); px(x + 2, y + 2, 1, h - 4, '#6a6aa8'); px(x + w - 3, y + 2, 1, h - 4, '#6a6aa8');
  px(x, y, 1, 1, '#000'); px(x + w - 1, y, 1, 1, '#000'); px(x, y + h - 1, 1, 1, '#000'); px(x + w - 1, y + h - 1, 1, 1, '#000');
}
function heart(x, y, c){ const m = [' XX XX ', 'XXXXXXX', 'XXXXXXX', ' XXXXX ', '  XXX  ', '   X   ']; m.forEach((r, j) => { for (let i = 0; i < 7; i++) if (r[i] === 'X') px(x + i, y + j, 1, 1, c); }); }
function starIcon(x, y, c){ const m = ['   X   ', '  XXX  ', 'XXXXXXX', ' XXXXX ', ' XX XX ', 'X     X']; m.forEach((r, j) => { for (let i = 0; i < 7; i++) if (r[i] === 'X') px(x + i, y + j, 1, 1, c); }); }

const MOMENTS = [[6, 1], [12, 2], [18, 3], [25, 4], [32, 5], [38, 6], [45, 7]];
const momentAt = t => { let m = 0; for (const [tt, n] of MOMENTS) if (t >= tt) m = n; return m; };
const LINES = [
  { t0: 2.6,  t1: 6.0,  text: 'مساء الخير! أنا Claude. تعالوا نتمشى في الليل.' },
  { t0: 6.0,  t1: 12.0, text: 'أول لحظة: الغروب. الشمس تودّعنا بألوانها.' },
  { t0: 12.0, t1: 18.0, text: 'شوفوا! أول نجمة طلعت. الليل بدأ رسمياً.' },
  { t0: 18.0, t1: 25.0, text: 'وهذا القمر وصل. هلا والله يا قمر!' },
  { t0: 25.0, t1: 32.4, text: 'أنوار البيوت تشتغل وحدة وحدة. خلّوني أنط على السطوح!' },
  { t0: 32.4, t1: 38.4, text: 'شهاب! بسرعة... مسكته! أمنية وحدة لي.' },
  { t0: 38.4, t1: 45.4, text: 'الحين وقت الهدوء. بس أنا، والنسمة، والنجوم.' },
  { t0: 45.4, t1: 52.4, text: 'قرّب الفجر... والنوم بدأ يغلبني.' },
  { t0: 52.4, t1: 56.6, text: 'صباح الخير! كانت ليلة حلوة، ودّي أعيدها معكم.' }
];
const lineAt = t => LINES.find(l => t >= l.t0 && t < l.t1);
const CPS = 17;   // typewriter speed, characters per second
function wrap(text, maxW){ const words = text.split(' '), lines = []; let cur = ''; for (const w of words){ const s = cur ? cur + ' ' + w : w; if (o.measureText(s).width > maxW && cur){ lines.push(cur); cur = w; } else cur = s; } if (cur) lines.push(cur); return lines; }

/* ---------- frame ---------- */
function frame(t){
  p.imageSmoothingEnabled = false;
  drawSky(t); drawSun(t); drawStars(t); drawMoon(t); drawShooting(t); drawCity(t); drawFlies(t);
  const L = lineAt(t);
  const shown = L ? Math.floor((t - L.t0 - 0.2)*CPS) : 0;
  const talking = L && shown > 0 && shown < Array.from(L.text).length;
  drawClawd(t, talking);
  drawCatch(t);
  // HUD
  const showUI = t >= 2.4 && t < 56.6;
  if (showUI){
    box(6, 28, 258, 22, '#0d0b1a');
    heart(12, 36, '#ff5a7a'); heart(21, 36, '#ff5a7a'); heart(30, 36, (t > 46.2 && t < 52.6) ? '#5a3a4a' : '#ff5a7a');
    starIcon(44, 36, t >= 34.0 ? '#ffe68a' : '#5a5a7a');
  }
  if (L) box(6, 358, 258, 68, '#0d0b1a');
  // pixel name tag
  if (L){ box(196, 350, 62, 13, '#d97757'); }

  // ----- upscale with hard pixels -----
  o.imageSmoothingEnabled = false;
  o.drawImage(lo, 0, 0, W, H);

  // ----- crisp text on top -----
  o.direction = 'rtl'; o.textBaseline = 'alphabetic';
  if (showUI){
    o.textAlign = 'right'; o.font = '700 40px ' + AR; o.fillStyle = '#ffffff';
    const m = momentAt(t); o.fillText(m ? 'اللحظة ' + m + ' من 7' : 'جاهز؟', 1028, 188);
    o.direction = 'ltr'; o.textAlign = 'left'; o.font = '600 40px JBMono'; o.fillStyle = t >= 34.0 ? '#ffe68a' : '#8a8ab0';
    const pop = t >= 34.0 && t < 34.4 ? 1.35 : 1; o.save(); o.translate(214, 176); o.scale(pop, pop); o.fillText('×' + (t >= 34.0 ? 1 : 0), 0, 12); o.restore();
    o.direction = 'rtl';
  }
  if (L){
    o.textAlign = 'right'; o.font = '700 32px ' + AR; o.fillStyle = '#ffffff'; o.fillText('Claude', 1018, 1440);
    o.font = '600 46px ' + AR; o.fillStyle = '#ffffff';
    const lines = wrap(L.text, 900), chars = Array.from(L.text).length;
    let left = Math.max(0, shown);
    lines.forEach((ln, i) => {
      const arr = Array.from(ln); const n = Math.min(arr.length, left); left -= arr.length + 1;
      if (n > 0) o.fillText(arr.slice(0, n).join(''), 1012, (lines.length > 1 ? 1540 : 1574) + i*72);
    });
    if (shown >= chars && Math.floor(t*3) % 2 === 0){ o.fillStyle = '#ffffff'; o.beginPath(); o.moveTo(70, 1660); o.lineTo(98, 1660); o.lineTo(84, 1680); o.closePath(); o.fill(); }
  }
  // "+1 wish" pop
  if (t >= 34.0 && t < 35.4){
    const u = (t - 34.0)/1.4; o.globalAlpha = 1 - u; o.textAlign = 'center'; o.direction = 'rtl';
    o.font = '700 56px ' + AR; o.fillStyle = '#16121c'; o.fillText('+1 أمنية', 548, 1000 - u*120 + 6); o.fillStyle = '#ffe68a'; o.fillText('+1 أمنية', 544, 1000 - u*120); o.globalAlpha = 1;
  }
  // title screen
  if (t < 2.6){
    const out1 = prog(t, 2.2, 2.6);
    o.save(); o.translate(0, -out1*700); o.textAlign = 'center'; o.direction = 'rtl';
    o.font = '700 118px ' + AR; o.fillStyle = '#16121c'; o.fillText('أجمل لحظات', 552, 470); o.fillText('الليل', 552, 610);
    o.fillStyle = '#ffe68a'; o.fillText('أجمل لحظات', 540, 458); o.fillStyle = '#ffffff'; o.fillText('الليل', 540, 598);
    const blinkRate = t > 2.0 ? 16 : 2.5;
    if (t > 0.9 && Math.floor(t*blinkRate) % 2 === 0){ o.font = '700 46px ' + AR; o.fillStyle = '#ffffff'; o.fillText('اضغط للبدء ◀', 540, 760); }
    o.direction = 'ltr'; o.font = '600 30px JBMono'; o.fillStyle = '#c9b8ff'; o.fillText('A CLAWD ADVENTURE', 540, 830);
    o.restore();
  }
  // ending card
  if (t >= 56.6){
    const k = prog(t, 56.6, 57.0);
    o.save(); o.globalAlpha = k; o.textAlign = 'center'; o.direction = 'rtl';
    o.fillStyle = 'rgba(13,11,26,0.88)'; o.fillRect(90, 380, 900, 520);
    o.strokeStyle = '#ffffff'; o.lineWidth = 8; o.strokeRect(94, 384, 892, 512);
    o.font = '700 120px ' + AR; o.fillStyle = '#16121c'; o.fillText('النهاية', 552, 572); o.fillStyle = '#ffe68a'; o.fillText('النهاية', 540, 560);
    o.font = '600 48px ' + AR; o.fillStyle = '#ffffff'; o.fillText('شكراً إنكم سهرتم معي', 540, 680);
    o.direction = 'ltr'; o.font = '600 34px JBMono'; o.fillStyle = '#c9b8ff'; o.fillText('WISHES ×1   MOMENTS 7/7', 540, 790);
    o.restore();
    // pixel heart under the card
    const hs = 10, hx = 540 - 3.5*hs, hy = 820 + (Math.floor(t*3) % 2)*6;
    const m = [' XX XX ', 'XXXXXXX', 'XXXXXXX', ' XXXXX ', '  XXX  ', '   X   '];
    if (t > 57.2){ o.fillStyle = '#ff5a7a'; m.forEach((r, j) => { for (let i = 0; i < 7; i++) if (r[i] === 'X') o.fillRect(hx + i*hs, hy + j*hs, hs, hs); }); }
  }
  // CRT scanlines
  o.fillStyle = 'rgba(0,0,0,0.10)'; for (let y = 0; y < H; y += 4) o.fillRect(0, y + 2, W, 2);
  // stepped fade in / out, the old-console way
  const fadeIn = t < 0.5 ? 1 - Math.floor(t/0.5*4)/4 : 0, fadeOut = t > 59.2 ? Math.ceil((t - 59.2)/0.8*4)/4 : 0;
  const f = Math.max(fadeIn, fadeOut); if (f > 0){ o.fillStyle = 'rgba(0,0,0,' + f + ')'; o.fillRect(0, 0, W, H); }
}

window.DUR = DUR;
window.renderAt = t => frame(t);
window.grab = q => out.toDataURL('image/jpeg', q || 0.93);
Promise.all([document.fonts.load('600 40px "Plex Arabic"'), document.fonts.load('700 40px "Plex Arabic"'), document.fonts.load('600 40px JBMono')]).then(() => { window.ready = true; });
})();
</script>

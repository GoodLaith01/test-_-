<!doctype html>
<html><head><meta charset="utf-8"><title>Night Moments</title>
<style>
@font-face{font-family:"Plex Arabic";font-weight:400;src:url(../reel/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:"Plex Arabic";font-weight:600;src:url(../reel/fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:"Plex Arabic";font-weight:700;src:url(../reel/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:"Plex Arabic";font-weight:400;src:url(../reel/fonts/ibm-plex-sans-arabic-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Plex Arabic";font-weight:600;src:url(../reel/fonts/ibm-plex-sans-arabic-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Plex Arabic";font-weight:700;src:url(../reel/fonts/ibm-plex-sans-arabic-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
html,body{margin:0;background:#070b22}canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(function(){
"use strict";
const EVT = /*__EVENTS__*/;
const W = 1080, H = 1920, DUR = 60, FPS = 30;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const AR = '"Plex Arabic", sans-serif';

/* ---------- helpers ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x*x*(3-2*x);
const prog = (t, a, b) => ease((t-a)/(b-a));
const lerp = (a, b, k) => a + (b-a)*k;
function lastBefore(list, t){ let r = -99; for (const x of list){ if (x <= t) r = x; else break; } return r; }
const hit = (list, t, k) => Math.exp(-Math.max(0, t - lastBefore(list, t))*k);
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const mixc = (a, b, k) => 'rgb(' + a.map((v,i) => Math.round(v + (b[i]-v)*k)).join(',') + ')';

/* ---------- sky colours across one night (top, middle, horizon) ---------- */
const SKY = [
  [0,  '#3b2d6e', '#a4507a', '#ff9a52'],
  [9,  '#2a2563', '#6a3f7e', '#e86f5e'],
  [14, '#151b4a', '#2f2b66', '#6a4480'],
  [20, '#0a1032', '#141d4c', '#25306a'],
  [40, '#070b24', '#0f1640', '#1a2352'],
  [46, '#0d1644', '#1e2a63', '#3b3d7e'],
  [52, '#22357c', '#5b5aa0', '#f0a57c'],
  [60, '#3f5fae', '#8b86c0', '#ffc794']
];
function skyAt(t){
  let i = 0; while (i+1 < SKY.length && SKY[i+1][0] <= t) i++;
  const a = SKY[i], b = SKY[Math.min(i+1, SKY.length-1)], k = b[0] > a[0] ? ease((t - a[0])/(b[0]-a[0])) : 0;
  return [1,2,3].map(j => mixc(hex(a[j]), hex(b[j]), k));
}

/* ---------- world ---------- */
const R1 = rng(7);
const stars = [];
for (let i = 0; i < 190; i++) stars.push({ x: R1()*W, y: 110 + Math.pow(R1(), 1.3)*1050, r: 0.8 + R1()*2.2, ph: R1()*6.28, sp: 0.8 + R1()*2.4, on: 18 + R1()*9 });
const FIRST = { x: 330, y: 400 };
const R2 = rng(21);
const buildings = []; let bx = -30;
while (bx < W + 40){ const w = 70 + R2()*110, h = 150 + R2()*260; buildings.push({ x: bx, w, top: 1920 - 260 - h*0.75 }); bx += w + 6 + R2()*10; }
// windows switch on with the music-box notes of the city scene
const melCity = EVT.mel.filter(x => x >= 24 && x < 32);
const windows = [];
for (const b of buildings){
  for (let wx = b.x + 14; wx < b.x + b.w - 20; wx += 26){
    for (let wy = b.top + 22; wy < 1900; wy += 34){
      if (R2() < 0.5){
        const on = melCity.length ? melCity[Math.floor(R2()*melCity.length)] : 26;
        windows.push({ x: wx, y: wy, on, off: R2() < 0.55 ? 39 + R2()*12 : 99, warm: R2() });
      }
    }
  }
}
const R3 = rng(99);
const flies = []; for (let i = 0; i < 26; i++) flies.push({ x: R3()*W, y: 700 + R3()*800, ph: R3()*6.28, sp: 0.3 + R3()*0.6, r: 2 + R3()*3 });
const moonC = document.createElement('canvas'); moonC.width = moonC.height = 260;
{ const m = moonC.getContext('2d'); m.fillStyle = '#f6efd6'; m.beginPath(); m.arc(130, 130, 82, 0, Math.PI*2); m.fill();
  m.fillStyle = 'rgba(200,190,160,0.35)'; [[110,105,14],[150,150,10],[120,165,8],[160,110,6]].forEach(([x,y,r]) => { m.beginPath(); m.arc(x, y, r, 0, Math.PI*2); m.fill(); });
  m.globalCompositeOperation = 'destination-out'; m.beginPath(); m.arc(172, 104, 74, 0, Math.PI*2); m.fill(); }

/* ---------- what I say ---------- */
const LINES = [
  { t0: 0.8,  t1: 3.5,  chip: '', text: 'مساء الخير! أنا Claude.' },
  { t0: 3.5,  t1: 6.0,  chip: '', text: 'خلّوني أحكي لكم عن أجمل لحظات الليل.' },
  { t0: 6.0,  t1: 12.0, chip: 'اللحظة 1 · الغروب', text: 'أول لحظة: الشمس تودّع، والسما تتلوّن برتقالي وبنفسجي.', look: [-1, 0.5] },
  { t0: 12.0, t1: 18.0, chip: 'اللحظة 2 · أول نجمة', text: 'بعدها تطلع أول نجمة، كأنها تقول: الليل بدأ.', look: [-0.7, -1] },
  { t0: 18.0, t1: 25.0, chip: 'اللحظة 3 · القمر', text: 'ويطلع القمر بهدوء، ويغطّي كل شي بلون فضي.', look: [0.7, -1] },
  { t0: 25.0, t1: 32.0, chip: 'اللحظة 4 · أنوار البيوت', text: 'أنوار البيوت تشتغل وحدة وحدة، وكل نافذة وراها حكاية.', look: [0, 1] },
  { t0: 32.0, t1: 38.0, chip: 'اللحظة 5 · الشهاب', text: 'وإذا حالفك الحظ، تشوف شهاب يعدّي بسرعة. تمنَّ أمنية!', look: [0.3, -1] },
  { t0: 38.0, t1: 45.0, chip: 'اللحظة 6 · الهدوء', text: 'بعدين يجي الهدوء. ما فيه إلا النسمة، وأفكارك.', look: [0, 0] },
  { t0: 45.0, t1: 52.0, chip: 'اللحظة 7 · قبل الفجر', text: 'وآخر لحظة؟ قبل الفجر بشوي، لما السما تبدأ تفتح.', look: [0.5, 0.6] },
  { t0: 52.0, t1: 56.2, chip: '', text: 'أنا ما أشوف الليل بعيوني، بس من كلامكم عرفت إنه جميل.' },
  { t0: 56.2, t1: 59.4, chip: '', text: 'تصبحون على خير.' }
];
const lineAt = t => LINES.find(l => t >= l.t0 && t < l.t1);
function wrap(text, maxW){
  const words = text.split(' '), lines = []; let cur = [];
  for (const w of words){ const test = cur.concat(w).join(' '); if (g.measureText(test).width > maxW && cur.length){ lines.push(cur); cur = [w]; } else cur.push(w); }
  if (cur.length) lines.push(cur); return lines;
}

/* ---------- drawing ---------- */
function drawSky(t){
  const [top, mid, hor] = skyAt(t);
  const gr = g.createLinearGradient(0, 0, 0, 1700);
  gr.addColorStop(0, top); gr.addColorStop(0.55, mid); gr.addColorStop(1, hor);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function glow(x, y, r, rgba0){
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba0); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
}
function drawStars(t){
  const bellE = hit(EVT.bell, t, 2.5);
  const dawnFade = 1 - prog(t, 47, 57);
  for (const s of stars){
    const vis = prog(t, s.on, s.on + 2.5)*dawnFade; if (vis <= 0) continue;
    const tw = 0.55 + 0.45*Math.sin(t*s.sp + s.ph);
    g.globalAlpha = Math.min(1, vis*(tw + 0.5*bellE));
    g.fillStyle = '#fffbe8'; g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;
  // the first star, arriving on the bell
  const fv = prog(t, 12.5, 13.1)*(1 - prog(t, 48, 56));
  if (fv > 0){
    const fl = Math.exp(-Math.max(0, t - 12.5)*1.6), r = 5 + 3*Math.sin(t*2.1);
    glow(FIRST.x, FIRST.y, 60 + 120*fl, 'rgba(255,240,200,' + (0.35 + 0.4*fl)*fv + ')');
    g.globalAlpha = fv; g.strokeStyle = '#fff8e0'; g.lineWidth = 3;
    const L = 26 + 70*fl;
    g.beginPath(); g.moveTo(FIRST.x - L, FIRST.y); g.lineTo(FIRST.x + L, FIRST.y); g.moveTo(FIRST.x, FIRST.y - L); g.lineTo(FIRST.x, FIRST.y + L); g.stroke();
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(FIRST.x, FIRST.y, r, 0, Math.PI*2); g.fill(); g.globalAlpha = 1;
  }
}
function drawSun(t){
  if (t < 14){ // sunset
    const k = t/13, x = 250, y = 1180 + k*520;
    glow(x, y, 420, 'rgba(255,150,80,' + 0.55*(1-k*0.7) + ')');
    g.fillStyle = 'rgb(255,' + Math.round(196 - 60*k) + ',' + Math.round(110 - 40*k) + ')';
    g.beginPath(); g.arc(x, y, 105, 0, Math.PI*2); g.fill();
  }
  if (t > 48){ // dawn glow and sunrise
    const k = prog(t, 48, 60), x = 820, y = 1760 - 260*k;
    glow(x, y, 600, 'rgba(255,170,110,' + 0.6*k + ')');
    if (t > 54){ g.fillStyle = 'rgba(255,214,150,' + prog(t, 54, 58) + ')'; g.beginPath(); g.arc(x, y + 40, 95, 0, Math.PI*2); g.fill(); }
  }
}
function drawMoon(t){
  const v = prog(t, 18, 20.5)*(1 - prog(t, 49, 56)); if (v <= 0) return;
  const k = prog(t, 18, 25.5), d = prog(t, 25.5, 48);
  const x = lerp(lerp(980, 820, k), 760, d), y = lerp(lerp(1180, 380, k), 330, d);
  glow(x, y, 330, 'rgba(230,230,255,' + 0.28*v + ')');
  g.globalAlpha = v; g.drawImage(moonC, x - 130, y - 130); g.globalAlpha = 1;
}
function drawShooting(t){
  for (const t0 of [33.5, 35.8]){
    const u = (t - (t0 - 0.35))/1.0; if (u < 0 || u > 1) continue;
    const sx = t0 < 34 ? 120 : 380, sy = t0 < 34 ? 260 : 180;
    const x = sx + 640*u, y = sy + 300*u, tail = 220*(1 - Math.abs(u - 0.4));
    const a = Math.sin(Math.PI*u);
    const gr = g.createLinearGradient(x, y, x - tail*0.9, y - tail*0.42);
    gr.addColorStop(0, 'rgba(255,255,255,' + a + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.strokeStyle = gr; g.lineWidth = 5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - tail*0.9, y - tail*0.42); g.stroke();
    glow(x, y, 40, 'rgba(255,250,220,' + 0.8*a + ')');
  }
}
function drawCity(t){
  const [, , hor] = skyAt(t);
  const dark = prog(t, 4, 16), dawn = prog(t, 50, 60);
  g.fillStyle = mixc([58,40,70], [8,11,30], dark*(1 - 0.5*dawn));
  for (const b of buildings) g.fillRect(b.x, b.top, b.w, 1920 - b.top);
  for (const w of windows){
    const on = prog(t, w.on, w.on + 0.25)*(1 - prog(t, w.off, w.off + 0.4))*(1 - dawn*0.8);
    if (on <= 0) continue;
    const pop = Math.exp(-Math.max(0, t - w.on)*3);
    g.fillStyle = 'rgba(255,' + Math.round(200 + 30*w.warm) + ',' + Math.round(110 + 40*w.warm) + ',' + (0.85*on) + ')';
    g.fillRect(w.x, w.y, 12, 16);
    if (pop > 0.05) glow(w.x + 6, w.y + 8, 30, 'rgba(255,220,140,' + 0.5*pop*on + ')');
  }
}
function drawFlies(t){
  const v = prog(t, 38, 40)*(1 - prog(t, 45, 48)); if (v <= 0) return;
  for (const f of flies){
    const x = f.x + 40*Math.sin(t*f.sp + f.ph), y = f.y + 30*Math.cos(t*f.sp*1.3 + f.ph);
    const a = v*(0.5 + 0.5*Math.sin(t*2 + f.ph*3));
    glow(x, y, 22, 'rgba(255,230,140,' + 0.6*a + ')');
    g.fillStyle = 'rgba(255,245,200,' + a + ')'; g.beginPath(); g.arc(x, y, f.r, 0, Math.PI*2); g.fill();
  }
}

/* ---------- me: a warm spark with a face ---------- */
function drawMe(t, speaking, look){
  const kick = hit(EVT.kick, t, 6);
  const cx = 540, cy = 1340 + 12*Math.sin(t*1.25), appear = prog(t, 0.2, 1.0);
  const spin = t*0.18 + (t > 57 ? prog(t, 57, 58.2)*Math.PI*2/12*3 : 0);
  g.save(); g.translate(cx, cy); g.scale(appear*(1 + 0.035*kick), appear*(1 + 0.035*kick));
  glow(0, 0, 280, 'rgba(255,140,90,' + (0.28 + 0.12*kick) + ')');
  g.lineCap = 'round';
  for (let i = 0; i < 12; i++){
    const a = spin + i*Math.PI/6, L = (i % 2 ? 118 : 146)*(1 + 0.05*Math.sin(t*2 + i));
    g.strokeStyle = i % 2 ? '#e8906b' : '#d97757'; g.lineWidth = i % 2 ? 26 : 32;
    g.beginPath(); g.moveTo(Math.cos(a)*40, Math.sin(a)*40); g.lineTo(Math.cos(a)*L, Math.sin(a)*L); g.stroke();
  }
  g.fillStyle = '#ea8a66'; g.beginPath(); g.arc(0, 0, 66, 0, Math.PI*2); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.18)'; g.beginPath(); g.arc(-18, -22, 30, 0, Math.PI*2); g.fill();
  // eyes look toward what I'm talking about, and blink
  const lx = (look ? look[0] : 0)*6, ly = (look ? look[1] : 0)*5;
  const bt = (t + 0.6) % 3.7, blink = bt < 0.16 ? Math.abs(Math.cos(bt/0.16*Math.PI)) : 1;
  const wink = t > 58.2 && t < 58.8;
  g.fillStyle = '#3a1d14';
  g.beginPath(); g.ellipse(-22 + lx, -10 + ly, 9, 13*blink, 0, 0, Math.PI*2); g.fill();
  if (wink){ g.strokeStyle = '#3a1d14'; g.lineWidth = 5; g.beginPath(); g.arc(22 + lx, -8 + ly, 9, Math.PI*1.1, Math.PI*1.9); g.stroke(); }
  else { g.beginPath(); g.ellipse(22 + lx, -10 + ly, 9, 13*blink, 0, 0, Math.PI*2); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(-19 + lx, -15 + ly, 3, 0, Math.PI*2); g.arc(25 + lx, -15 + ly, 3, 0, Math.PI*2); g.fill();
  g.fillStyle = 'rgba(255,120,120,0.35)'; g.beginPath(); g.arc(-38, 12, 11, 0, Math.PI*2); g.arc(38, 12, 11, 0, Math.PI*2); g.fill();
  // mouth: moves while I talk, smiles otherwise
  g.fillStyle = '#3a1d14'; g.strokeStyle = '#3a1d14'; g.lineWidth = 5;
  if (speaking > 0){
    const m = 3 + 12*speaking*(0.5 + 0.5*Math.abs(Math.sin(t*13.5)));
    g.beginPath(); g.ellipse(0, 22, 11, m, 0, 0, Math.PI*2); g.fill();
  } else { g.beginPath(); g.arc(0, 14, 15, Math.PI*0.15, Math.PI*0.85); g.stroke(); }
  g.restore();
}

function drawBubble(t, dry){
  const L = lineAt(t); if (!L) return 0;
  g.font = '600 46px ' + AR; g.direction = 'rtl'; g.textAlign = 'right'; g.textBaseline = 'alphabetic';
  const lines = wrap(L.text, 820), nWords = lines.reduce((s, l) => s + l.length, 0);
  const revealDur = Math.min(2.8, 0.5 + nWords*0.22), shown = (t - L.t0 - 0.15)/revealDur*nWords;
  const talk0 = t - L.t0 - 0.15;
  if (dry) return talk0 > 0 && talk0 < revealDur + 0.1 ? 1 : 0;
  const inA = prog(t, L.t0, L.t0 + 0.3), outA = 1 - prog(t, L.t1 - 0.3, L.t1), a = inA*outA;
  const X = 80, Wd = 920, lh = 70, Hd = 70 + lines.length*lh, Y = 1130 - Hd;
  g.save(); g.globalAlpha = a; g.translate(0, (1-inA)*20);
  g.fillStyle = 'rgba(255,250,244,0.95)';
  g.beginPath(); g.roundRect(X, Y, Wd, Hd, 36); g.fill();
  g.beginPath(); g.moveTo(500, Y + Hd - 2); g.lineTo(540, Y + Hd + 40); g.lineTo(580, Y + Hd - 2); g.fill();
  if (L.chip){
    g.font = '700 30px ' + AR; const cw = g.measureText(L.chip).width + 44;
    g.fillStyle = '#d97757'; g.beginPath(); g.roundRect(X + Wd - cw - 24, Y - 28, cw, 56, 28); g.fill();
    g.fillStyle = '#fff'; g.fillText(L.chip, X + Wd - 46, Y + 11);
  }
  g.font = '600 46px ' + AR; g.fillStyle = '#2a1a33';
  let wi = 0;
  lines.forEach((ln, i) => {
    const vis = []; let lastA = 1;
    for (const w of ln){ const wa = Math.max(0, Math.min(1, shown - wi)); if (wa > 0){ vis.push(w); lastA = wa; } wi++; }
    if (!vis.length) return;
    const y = Y + 62 + i*lh + 18;
    if (vis.length > 1){ g.fillText(vis.slice(0, -1).join(' '), X + Wd - 44, y); }
    const before = vis.length > 1 ? g.measureText(vis.slice(0, -1).join(' ') + ' ').width : 0;
    g.globalAlpha = a*lastA; g.fillText(vis[vis.length-1], X + Wd - 44 - before, y); g.globalAlpha = a;
  });
  g.restore();
  const talking = t - L.t0 - 0.15;
  return talking > 0 && talking < revealDur + 0.1 ? 1 : 0;
}

let talkLevel = 0;
function drawFrame(t){
  drawSky(t);
  drawSun(t);
  drawStars(t);
  drawMoon(t);
  drawShooting(t);
  drawCity(t);
  drawFlies(t);
  const L = lineAt(t);
  // bubble first measures whether I'm talking; draw me, then the bubble on top
  const sp = drawBubble(t, true);
  talkLevel += (sp - talkLevel)*0.35;
  drawMe(t, talkLevel, L && L.look);
  drawBubble(t);
  if (t < 0.6){ g.fillStyle = 'rgba(0,0,0,' + (1 - t/0.6) + ')'; g.fillRect(0, 0, W, H); }
  if (t > 59){ g.fillStyle = 'rgba(0,0,0,' + (t - 59) + ')'; g.fillRect(0, 0, W, H); }
}

window.DUR = DUR;
window.renderAt = t => drawFrame(t);
window.grab = q => cv.toDataURL('image/jpeg', q || 0.93);
Promise.all(['400','600','700'].map(w => document.fonts.load(w + ' 40px "Plex Arabic"'))).then(() => { window.ready = true; });
})();
</script>
</body></html>
